name: Website

on:
  push:
    branches: [master]
    paths: ['website/**', 'examples/**', 'src/**', 'MIGRATION.md', 'CHANGELOG.md', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'examples/**', 'src/**', 'MIGRATION.md', 'CHANGELOG.md', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      # The live demo runs peer-cdn from ../src, which imports peer-data from the root's node_modules.
      - run: npm ci
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      # The site is served under /peer-cdn/, so check it laid out the same way.
      - name: Lay out the site as GitHub Pages serves it
        run: mkdir -p _site && cp -R website/dist _site/peer-cdn
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir "${{ github.workspace }}/_site" --index-files index.html --no-progress '_site/**/*.html'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
